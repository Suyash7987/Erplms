name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, prisma, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erplms
          POSTGRES_PASSWORD: erplms_ci_password
          POSTGRES_DB: erplms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erplms -d erplms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://erplms:erplms_ci_password@localhost:5432/erplms_test?schema=public
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -w @erplms/api
      - run: npm run prisma:validate -w @erplms/api
      - run: npm run test:coverage -w @erplms/api

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w @erplms/web
      - run: npm run build -w @erplms/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
