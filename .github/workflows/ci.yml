name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, prisma, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The tests recreate this database. The role must not be a superuser, or RLS is bypassed.
      TEST_DATABASE_URL: postgresql://erplms:erplms_ci_password@localhost:5432/erplms_test?schema=public
      DATABASE_URL: postgresql://erplms:erplms_ci_password@localhost:5432/erplms_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create non-superuser app role
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE ROLE erplms LOGIN PASSWORD 'erplms_ci_password' CREATEDB;"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -w @erplms/api
      - run: npm run prisma:validate -w @erplms/api
      - run: npm run test:coverage -w @erplms/api

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w @erplms/web
      - run: npm run build -w @erplms/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
