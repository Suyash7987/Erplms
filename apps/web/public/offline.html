<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline · School ERP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans',
          'Noto Sans Devanagari',
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 16px;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Check your internet connection and try again.</p>
      <h1 lang="hi">आप ऑफ़लाइन हैं</h1>
      <p lang="hi">अपना इंटरनेट कनेक्शन जाँचें और फिर से कोशिश करें।</p>
      <button type="button" onclick="location.reload()">Try again / फिर से कोशिश करें</button>
    </main>
  </body>
</html>
